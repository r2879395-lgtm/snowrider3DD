<!DOCTYPE html>
<html lang="en-us">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Snow Rider 3D</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <meta name="description" content="Snow Rider 3D, Snow Rider 3D Mathnook, Snow Rider 3D Unblocked">
    <meta property="og:image" content="snow-rider-3d.png" />
    <script src="TemplateData/UnityProgress.js"></script>
    <script src="Build/UnityLoader.js"></script>
    <script>
        // Override console.error temporarily to suppress Unity WebGL errors
        var originalConsoleError = console.error;
        console.error = function() {
            var msg = arguments[0];
            if (msg && typeof msg === 'string' && msg.includes('getParameter')) {
                return; // Suppress getParameter errors
            }
            originalConsoleError.apply(console, arguments);
        };

        // Suppress Unity alert popups mentioning getParameter
        var originalAlert = window.alert;
        window.alert = function(msg) {
            if (typeof msg === 'string' && msg.includes('getParameter')) {
                console.warn('Suppressed Unity getParameter alert');
                return;
            }
            return originalAlert.call(window, msg);
        };

        // Ensure UnityLoader exists before we call it
        if (typeof UnityLoader === 'undefined') {
            document.write('<p style="color:white;">UnityLoader failed to load. Please refresh.</p>');
        }
        
        // Slowdown toggle: press 'X' to toggle slowdown mode
        (function() {
            let slowdownEnabled = false;
            let lastToggle = 0;
            const debounceMs = 300;

            function trySendSlowdown(multiplier) {
                // Attempt common Unity targets/methods for slowdown
                const targets = ['GameController', 'Player', 'Controller', 'GameManager'];
                const methods = ['SetSpeedMultiplier', 'SetTimeScale', 'ApplySlowdown'];
                for (const t of targets) {
                    for (const m of methods) {
                        try {
                            if (window.SendMessage) {
                                window.SendMessage(t, m, String(multiplier));
                                console.log(`⏬ Sent slowdown: ${t}.${m}(${multiplier})`);
                                return true;
                            }
                        } catch (e) { /* continue */ }
                    }
                }
                console.log('ℹ️ Slowdown SendMessage not supported in this build');
                return false;
            }

            window.applySlowdown = function(enable) {
                slowdownEnabled = !!enable;
                const ok = trySendSlowdown(slowdownEnabled ? 0.5 : 1.0);
                // Visual indicator overlay
                const id = 'slowdownIndicator';
                let el = document.getElementById(id);
                if (!el) {
                    el = document.createElement('div');
                    el.id = id;
                    el.style.position = 'fixed';
                    el.style.top = '20px';
                    el.style.left = '20px';
                    el.style.padding = '8px 12px';
                    el.style.borderRadius = '8px';
                    el.style.zIndex = '1000';
                    el.style.fontWeight = 'bold';
                    document.body.appendChild(el);
                }
                el.textContent = slowdownEnabled ? '⏬ Slow Mode ON' : '⏩ Slow Mode OFF';
                el.style.background = slowdownEnabled ? 'rgba(255, 170, 0, 0.85)' : 'rgba(0,0,0,0.5)';
                el.style.color = slowdownEnabled ? '#000' : '#fff';
                if (!ok) {
                    el.textContent += ' (visual only)';
                }
            };

            window.addEventListener('keydown', (e) => {
                if ((Date.now() - lastToggle) < debounceMs) return;
                // Toggle on X key
                if (e.key && e.key.toLowerCase() === 'x') {
                    lastToggle = Date.now();
                    window.applySlowdown(!slowdownEnabled);
                }
            });
        })();
        
        // Automatic score detection disabled
        (function() {
            console.log('ℹ️ Automatic score detection is disabled. Use manual submit.');
        })();
        
        // Don't load Unity immediately - wait for player name
        var gameInstance = null;
        window.initUnity = function() {
            if (!gameInstance) {
                const container = document.getElementById("gameContainer");
                if (!container) {
                    console.error("❌ gameContainer not found");
                    return;
                }
                
                // Restore original console.error after Unity loads
                setTimeout(() => {
                    console.error = originalConsoleError;
                }, 5000);
                
                gameInstance = UnityLoader.instantiate("gameContainer", "Build/SnowRider3D-gd-1.json", { 
                    onProgress: UnityProgress
                });
                
                // Wait for Unity to fully initialize before trying to hook
                setTimeout(() => {
                    try {
                        if (gameInstance && gameInstance.Module) {
                            console.log("✅ Unity Module loaded, attempting to hook score callbacks");
                            
                            // Attempt to hook gameInstance.SendMessage directly
                            if (gameInstance.SendMessage && typeof gameInstance.SendMessage === 'function') {
                                const originalGameSendMessage = gameInstance.SendMessage;
                                gameInstance.SendMessage = function(obj, method, value) {
                                    console.log("🎮 gameInstance.SendMessage called:", { obj, method, value });
                                    if (typeof value !== "undefined" && !isNaN(value) && Number(value) > 0) {
                                        console.log("🎯 Score detected via gameInstance.SendMessage:", value);
                                        if (window.receiveScore) {
                                            window.receiveScore(Number(value));
                                        }
                                    }
                                    return originalGameSendMessage.call(this, obj, method, value);
                                };
                                console.log("✅ gameInstance.SendMessage hooked");
                            }
                            
                            // Try to set score callback
                            if (typeof gameInstance.Module.scoreCallback === 'undefined') {
                                gameInstance.Module.scoreCallback = function(score) {
                                    console.log("🎯 Score callback triggered:", score);
                                    if (window.receiveScore) {
                                        window.receiveScore(score);
                                    }
                                };
                                console.log("✅ gameInstance.Module.scoreCallback installed");
                            }
                        
                            // Try to hook into canvas context for state monitoring
                            const canvas = gameInstance.container.querySelector('canvas');
                            if (canvas) {
                                console.log("✅ Canvas found:", canvas.width, "x", canvas.height);
                                // Monitor for when canvas stops rendering (game end)
                                let lastPixelData = null;
                                setInterval(() => {
                                    try {
                                        const ctx = canvas.getContext('webgl') || canvas.getContext('2d');
                                        if (ctx && ctx.getImageData) {
                                            const data = ctx.getImageData(0, 0, 1, 1);
                                            if (JSON.stringify(data) !== lastPixelData) {
                                                lastPixelData = JSON.stringify(data);
                                            }
                                        }
                                    } catch (e) {
                                        // Canvas context unavailable
                                    }
                                }, 1000);
                            }
                        }
                    } catch(e) {
                        console.log("ℹ️ Could not fully hook Unity Module:", e.message);
                    }
                }, 3000);
            }
        };
    </script>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>

<body style="overflow:hidden; margin:0; padding:0;">
    <div class="webgl-content" style="position: absolute; width: 100%; height: 100%;">
        <div id="gameContainer" style="width: 960px; height: 600px; margin: auto"></div>
    </div>

    <!-- Leaderboard Button -->
    <button id="leaderboardBtn" class="leaderboard-btn">🏆 Leaderboard</button>
    
    
    
    <!-- Manual Score Entry Button -->
    <button id="scanScoreBtn" class="scan-score-btn">➕ Submit Score</button>
    
    <!-- Admin Remove Scores Button -->
    <button id="removeScoresBtn" class="remove-scores-btn">🗑️ Remove Scores</button>

    <!-- Active Players Badge -->
    <div id="activePlayersBadge" class="active-players-badge">
        <span id="activePlayers">🎮 0 playing</span>
        <div id="activePlayersList" class="active-players-dropdown">
            <div class="dropdown-header">Currently Playing:</div>
            <div id="playersListContent" class="players-list-content">No players online</div>
        </div>
    </div>

    <!-- Leaderboard Modal -->
    <div id="leaderboardModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div class="leaderboard-header">
                <h2>🏆 Global Leaderboard</h2>
                <div class="leaderboard-status">
                    <span id="connectionStatus" class="status-badge">🔄 Connecting...</span>
                    <span id="playerCount" class="player-count">0 players</span>
                </div>
            </div>
            <div class="leaderboard-tabs">
                <button class="tab-btn active" data-tab="global">🌍 Global</button>
                <button class="tab-btn" data-tab="local">💾 Local</button>
            </div>
            <div id="leaderboardList" class="leaderboard-list"></div>
        </div>
    </div>

    <!-- Score Submit Modal -->
    <div id="scoreModal" class="modal">
        <div class="modal-content">
            <span class="close" id="scoreModalClose">&times;</span>
            <h2>🎉 New High Score!</h2>
            <p>Your score: <span id="currentScore"></span></p>
            <p style="margin: 15px 0;">Submitting as: <strong id="playerNameDisplay"></strong></p>
            <div style="display: flex; gap: 10px;">
                <button id="submitScore" class="submit-btn" style="flex: 1;">Submit Score</button>
                <button id="dismissScore" class="submit-btn" style="flex: 1; background: linear-gradient(135deg, #888 0%, #666 100%);">Skip</button>
            </div>
        </div>
    </div>

    <!-- Welcome/Login Modal -->
    <div id="welcomeModal" class="modal" style="display: none;">
        <div class="modal-content welcome-modal">
            <h2>🎮 Welcome to Snow Rider 3D!</h2>
            <p style="margin: 20px 0; font-size: 16px;">Enter your name to start playing:</p>
            <input type="text" id="welcomePlayerName" placeholder="Your name" maxlength="20" class="welcome-input">
            <button id="welcomeStartBtn" class="submit-btn" style="margin-top: 20px; width: 100%;">Start Playing</button>
        </div>
    </div>

    

    <script src="js/firebase-config.js"></script>
    <script src="js/leaderboard.js"></script>
    <script src="js/unity-bridge.js"></script>
</body>

</html>
